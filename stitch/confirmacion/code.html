<div class="absolute inset-0 w-full h-full bg-surface/70 backdrop-blur-md"></div>
</div>
<div class="relative z-10 flex flex-col h-full px-6 py-12">
<!-- Top Section -->
<div class="flex flex-col items-center text-center mb-8">

<h1 class="font-headline-lg-mobile text-on-surface mb-2" style="color: rgb(88, 99, 87); letter-spacing: 0.1em; text-transform: uppercase; font-size: 24px;">Confirmar Asistencia</h1>
<p class="font-body-md text-on-surface-variant">Por favor completa los siguientes datos</p>
</div>
<!-- Main Card -->
<div class="flex-1 bg-white/10 backdrop-blur-sm rounded-full border border-white/20 p-10 flex flex-col shadow-sm mb-8 mx-4">
<!-- Invitation Details -->
<div class="mb-8 text-center">
<p class="font-label-md text-on-surface-variant uppercase tracking-wider mb-2">Invitación para:</p>
<h2 class="font-display-lg text-primary text-4xl mb-1" style="color: rgb(88, 99, 87); letter-spacing: 0.15em;">Familia Invitada</h2>
<p class="font-body-md text-on-surface-variant italic">1 invitado</p>
</div>
<!-- Divider -->

<!-- Attendance Status -->
<div class="flex flex-col gap-4">
<p class="font-label-md text-on-surface-variant uppercase tracking-wider text-center mb-2">Estado de asistencia</p>
<!-- Option 1 -->
<label class="group relative cursor-pointer">
<input checked="" class="peer sr-only" name="attendance" type="radio" value="confirm">
<div class="w-full flex items-center py-3 px-6 rounded-full bg-transparent border border-[#586357]/20 peer-checked:border-[#586357] peer-checked:bg-[#fff2e6]/30 transition-all">
<div class="w-10 h-10 rounded-full flex items-center justify-center mr-4 group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-primary" style="color: rgb(88, 99, 87); font-size: 20px;">favorite</span>
</div>
<span class="font-body-md text-on-surface font-semibold peer-checked:text-on-primary-container" style="color: rgb(88, 99, 87); font-weight: 400; letter-spacing: 0.05em;">Confirmo mi asistencia</span>
</div>
</label>
<!-- Option 2 -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="attendance" type="radio" value="less">
<div class="w-full flex items-center py-3 px-6 rounded-full bg-transparent border border-[#586357]/20 peer-checked:border-[#586357] peer-checked:bg-[#fff2e6]/30 transition-all">
<div class="w-10 h-10 rounded-full flex items-center justify-center mr-4 group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-primary" style="color: rgb(88, 99, 87); font-size: 20px;">person_remove</span>
</div>
<span class="font-body-md text-on-surface font-semibold peer-checked:text-on-primary-container" style="color: rgb(88, 99, 87); font-weight: 400; letter-spacing: 0.05em;">Asistiré con menos personas</span>
</div>
</label>
<!-- Option 3 -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="attendance" type="radio" value="decline">
<div class="w-full flex items-center py-3 px-6 rounded-full bg-transparent border border-[#586357]/20 peer-checked:border-[#586357] peer-checked:bg-[#fff2e6]/30 transition-all">
<div class="w-10 h-10 rounded-full flex items-center justify-center mr-4 group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-primary" style="color: rgb(88, 99, 87); font-size: 20px;">close</span>
</div>
<span class="font-body-md text-on-surface font-semibold peer-checked:text-on-primary-container" style="color: rgb(88, 99, 87); font-weight: 400; letter-spacing: 0.05em;">No podré asistir</span>
</div>
</label>
</div>
</div>
<!-- Footer -->
<div class="mt-auto pb-safe">
<button class="mx-auto w-auto min-w-[180px] bg-[#586357] text-[#fff2e6] font-label-md py-3 px-10 rounded-full shadow-sm hover:opacity-90 transition-all active:scale-[0.98] flex items-center justify-center gap-3 uppercase tracking-[0.2em]">

<span class="material-symbols-outlined text-sm">arrow_forward</span>

</div>
