<style>

            background: linear-gradient(to bottom, rgba(115, 65, 65, 0.15) 0%, rgba(88, 99, 87, 0.25) 100%);

        }

            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse-soft {

        }
        @keyframes pulse-soft {

            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(115, 65, 65, 0); }

</div>
<script>
    let isPlaying = false;
    function toggleMusic() {
        const btn = document.getElementById('play-btn');
        const icon = btn.querySelector('.material-symbols-outlined');
        isPlaying = !isPlaying;
        
        if (isPlaying) {
            icon.innerText = 'pause';
            btn.classList.remove('pulse-soft');
        } else {
            icon.innerText = 'play_arrow';
            btn.classList.add('pulse-soft');
        }
    }

    function openInvitation() {
        const main = document.querySelector('main');
        main.style.transition = 'all 1s ease-in-out';
        main.style.opacity = '0';
        main.style.transform = 'scale(1.1)';
        
        setTimeout(() => {
            alert('Welcome to the Ethereal Union experience.');
            main.style.opacity = '1';
            main.style.transform = 'scale(1)';
        }, 1000);
    }
</script>
